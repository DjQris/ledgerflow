name: ledgerflow-phase4-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledgerflow_phase1f_integration_phase4
      POSTGRES_PASSWORD: ${PHASE4_POSTGRES_PASSWORD:?Run a Phase 4 script to generate isolated local credentials}
      POSTGRES_USER: ledgerflow_phase4_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - phase4_test_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  phase4_test_postgres:
